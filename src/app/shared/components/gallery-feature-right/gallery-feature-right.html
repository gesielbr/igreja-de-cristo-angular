<div class="row g-2 mt-4">
  <div class="col-12 col-lg-5">
    <div class="row g-2">
      <div class="col-12">
        <figure class="mb-0">
          <button
            type="button"
            class="gallery-trigger gallery-photo gallery-photo-small border-0 p-0 rounded-4 overflow-hidden w-100"
            [attr.aria-label]="'Ampliar foto: ' + photos()[0].alt"
            (click)="openLightbox(0)"
          >
            <img
              [src]="photos()[0].src"
              [alt]="photos()[0].alt"
              loading="lazy"
              decoding="async"
              width="700"
              height="420"
            />

            <span class="gallery-zoom">
              <i aria-hidden="true" class="bi bi-arrows-fullscreen"></i>
            </span>
          </button>
        </figure>
      </div>

      <div class="col-12">
        <figure class="mb-0">
          <button
            type="button"
            class="gallery-trigger gallery-photo gallery-photo-small border-0 p-0 rounded-4 overflow-hidden w-100"
            [attr.aria-label]="'Ampliar foto: ' + photos()[1].alt"
            (click)="openLightbox(1)"
          >
            <img
              [src]="photos()[1].src"
              [alt]="photos()[1].alt"
              loading="lazy"
              decoding="async"
              width="700"
              height="420"
            />

            <span class="gallery-zoom">
              <i aria-hidden="true" class="bi bi-arrows-fullscreen"></i>
            </span>
          </button>
        </figure>
      </div>
    </div>
  </div>

  <div class="col-12 col-lg-7">
    <figure class="mb-0">
      <button
        type="button"
        class="gallery-trigger gallery-photo gallery-photo-feature gallery-photo-top border-0 p-0 rounded-4 overflow-hidden w-100"
        [attr.aria-label]="'Ampliar foto: ' + photos()[2].alt"
        (click)="openLightbox(2)"
      >
        <img
          [src]="photos()[2].src"
          [alt]="photos()[2].alt"
          loading="lazy"
          decoding="async"
          width="900"
          height="650"
        />

        <span class="gallery-zoom">
          <i aria-hidden="true" class="bi bi-arrows-fullscreen"></i>
        </span>
      </button>
    </figure>
  </div>
</div>

<app-lightbox [photos]="photos()" />
